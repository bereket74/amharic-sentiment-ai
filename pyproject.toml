[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amharic-sentiment-ai"
version = "0.1.0"
description = "A reproducible three-way Amharic sentiment benchmark and demo"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "torch>=2.1,<3",
  "transformers>=4.45,<5",
  "sentencepiece>=0.2,<1",
  "safetensors>=0.4,<1",
  "gradio>=5,<7",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
